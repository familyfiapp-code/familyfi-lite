<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0f5f55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FamilyFi Lite">
<meta name="description" content="FamilyFi Lite – your personal money app. Add spending in seconds, set a budget, grow savings goals.">
<title>FamilyFi Lite</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f6f5;--card:#fff;--ink:#14231f;--mute:#62716c;--line:#e3e8e6;
  --brand:#0f5f55;--brand2:#13806f;--soft:#e4f2ef;--accent:#f2a33a;
  --red:#d2443b;--green:#1f9254;--r:18px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1513;--card:#16211e;--ink:#e8efed;--mute:#93a39e;--line:#24322e;
  --brand:#34b39f;--brand2:#2a9887;--soft:#173430;--accent:#f2b155;--red:#ff6b61;--green:#4cc785;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(84px + var(--safe-b))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(12px + var(--safe-t)) 0 14px}
@media (prefers-color-scheme:dark){header.top{background:#0f2a26}}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:800;font-size:19px;letter-spacing:.2px}
.brand small{font-weight:600;opacity:.75;font-size:12px;margin-left:4px;background:rgba(255,255,255,.18);padding:2px 7px;border-radius:9px}
.hi{font-size:13px;opacity:.85;margin-top:2px}
.sync{font-size:12px;background:rgba(255,255,255,.16);padding:5px 10px;border-radius:20px;color:#fff;white-space:nowrap}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:14px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h3{margin:0 0 10px;font-size:15px}
.muted{color:var(--mute);font-size:13px}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.monthbar button{width:38px;height:38px;border-radius:12px;background:var(--card);font-size:18px}
.monthbar b{font-size:16px}
.hero{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.hero .big{font-size:30px;font-weight:800;margin:2px 0}
.hero .split{display:flex;gap:10px;margin-top:12px}
.hero .split div{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px;font-size:12px}
.hero .split b{display:block;font-size:15px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.hero .bar{background:rgba(255,255,255,.25)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .4s}
.bar i.ok{background:var(--green)}.bar i.over{background:var(--red)}
.hero .bar i{background:#fff}.hero .bar i.over{background:#ffb4ab}
.cats .c{display:flex;align-items:center;gap:10px;padding:7px 0}
.cats .e{width:36px;height:36px;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-size:18px;flex:none}
.cats .m{flex:1;min-width:0}.cats .m .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .e{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:19px;flex:none}
.tx .m{flex:1;min-width:0}.tx .m b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:700;white-space:nowrap}.tx .a.in{color:var(--green)}
.tag{font-size:10px;background:var(--soft);color:var(--brand);padding:1px 6px;border-radius:6px;margin-left:4px;font-weight:700}
.dayhead{font-size:12px;font-weight:700;color:var(--mute);margin:14px 0 2px;text-transform:uppercase;letter-spacing:.5px}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.empty .big{font-size:40px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tabs .wrap{display:flex;justify-content:space-around;align-items:center;height:64px;padding:0}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mute);gap:2px;height:100%;justify-content:center}
nav.tabs button span{font-size:21px;line-height:1}
nav.tabs button.on{color:var(--brand);font-weight:700}
nav.tabs .fab{flex:none;width:58px;height:58px;border-radius:20px;background:var(--brand);color:#fff;font-size:30px;margin-top:-26px;box-shadow:0 6px 16px rgba(15,95,85,.35);display:grid;place-items:center}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .25s ease;padding:8px 0 calc(18px + var(--safe-b))}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h2{margin:0 0 12px;font-size:18px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.amt{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--brand);padding:4px 0;margin-bottom:14px}
.amt span{font-size:28px;font-weight:700;color:var(--mute)}
.amt input{border:0;outline:0;background:none;font-size:34px;font-weight:800;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.chip{padding:7px 11px;border-radius:20px;background:var(--bg);font-size:13px;border:1.5px solid transparent}
.chip.on{border-color:var(--brand);background:var(--soft);color:var(--brand);font-weight:700}
label.f{display:block;font-size:12px;color:var(--mute);font-weight:600;margin:10px 0 4px}
.in{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:0}
.in:focus{border-color:var(--brand)}
textarea.in{min-height:92px;resize:vertical}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--brand);color:#fff;font-weight:700;font-size:16px;margin-top:14px}
.btn.ghost{background:var(--soft);color:var(--brand)}
.btn.danger{background:none;color:var(--red);border:1px solid var(--line)}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:0;border-radius:11px}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.goal{padding:12px 0;border-bottom:1px solid var(--line)}.goal:last-child{border-bottom:0}
.goal .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.goal .t b{font-size:15px}
.set{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);gap:10px}
.set:last-child{border-bottom:0}
.set .muted{display:block}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translate(-50%,20px);background:#14231f;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:40;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.chart{width:100%;height:120px;display:block}
.search{margin-top:14px}
.welcome{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:30px 22px;background:linear-gradient(160deg,#0f5f55,#13806f 60%,#1b9a84);color:#fff}
.welcome h1{font-size:30px;margin:14px 0 6px}
.welcome p{opacity:.9;margin:0 0 6px}
.welcome .in{background:rgba(255,255,255,.95);color:#14231f;border:0}
.welcome label.f{color:rgba(255,255,255,.85)}
.welcome .btn{background:#fff;color:#0f5f55}
.welcome .btn.ghost{background:rgba(255,255,255,.15);color:#fff}
.logo{width:72px;height:72px;border-radius:20px;background:#fff;display:grid;place-items:center;font-size:38px}
.foot{text-align:center;font-size:11px;color:var(--mute);padding:10px 0 20px}
.smsres{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:8px;display:none}
.hidden{display:none!important}
.plan{border:2px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.plan.best{border-color:var(--brand);background:var(--soft)}
.plan .p{font-size:22px;font-weight:800}.plan .p small{font-size:13px;font-weight:600;color:var(--mute)}
.save{font-size:11px;font-weight:800;background:var(--accent);color:#fff;padding:2px 8px;border-radius:8px}
.banner{background:#fff4e0;color:#7a4b00;font-size:13px;padding:9px 12px;border-radius:12px;margin-top:12px}
@media (prefers-color-scheme:dark){.banner{background:#3a2b10;color:#f8d79a}}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px}
.gbtn svg{width:20px;height:20px}
.spin{width:34px;height:34px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs hidden" id="tabs"><div class="wrap">
  <button data-t="home" class="on"><span>🏠</span>Home</button>
  <button data-t="hist"><span>📒</span>History</button>
  <button class="fab" id="fab" aria-label="Add">＋</button>
  <button data-t="goals"><span>🎯</span>Goals</button>
  <button data-t="more"><span>⚙️</span>More</button>
</div></nav>
<div class="sheet-bg" id="sbg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div class="wrap" id="sbody"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="filein" accept="application/json" class="hidden">
